<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Salar King 👑 | Unified Operations Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Animated Background Layers -->
    <div class="bg-grid"></div>
    <div class="bg-particles" id="bg-particles"></div>
    <div class="bg-glow bg-glow--one"></div>
    <div class="bg-glow bg-glow--two"></div>
    <div class="bg-glow bg-glow--three"></div>

    <!-- Top Navigation -->
    <header class="topbar">
        <div class="topbar__inner">
            <div class="logo">
                <span class="logo__crown">👑</span>
                <span class="logo__text">SALAR <em>KING</em></span>
            </div>
            <div class="status-pill">
                <span class="status-pill__dot"></span>
                <span>SECURE NODE · ONLINE</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="dashboard">

        <!-- SECTION 1: SMS BOMBER -->
        <section class="panel panel--primary" id="bomber-panel">
            <div class="panel__header">
                <div class="panel__icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
                        <circle cx="12" cy="12" r="3.2"/>
                        <path d="M12 2v3M12 19v3M2 12h3M19 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M18.8 5.2l-2.1 2.1M7.3 16.7l-2.1 2.1"/>
                    </svg>
                </div>
                <div class="panel__titles">
                    <h2 class="panel__title">SMS BOMBER</h2>
                    <p class="panel__subtitle">Precision strike dispatcher</p>
                </div>
            </div>

            <form id="bomber-form" class="app-form" novalidate>
                <div class="form-field">
                    <label for="bomber-phone">
                        <span class="form-field__icon">📱</span>
                        Target Phone
                    </label>
                    <div class="input-shell">
                        <span class="input-shell__prefix">+92</span>
                        <input type="text" id="bomber-phone" placeholder="3001234567" required autocomplete="off" spellcheck="false"/>
                    </div>
                </div>

                <div class="form-field">
                    <label for="bomber-count">
                        <span class="form-field__icon">💥</span>
                        Strike Count
                    </label>
                    <div class="input-shell">
                        <input type="number" id="bomber-count" value="10" min="1" max="100" required/>
                    </div>
                </div>

                <button type="submit" class="action-btn action-btn--primary" id="bomber-btn">
                    <span class="action-btn__text">⚡ Launch Strike</span>
                    <span class="action-btn__loader">
                        <span class="spinner"></span>
                        <span id="bomber-btn-status">Transmitting...</span>
                    </span>
                </button>
            </form>

            <div class="response-box" id="bomber-response">
                <span class="response-box__icon" id="bomber-response-icon">🛡️</span>
                <span class="response-box__text" id="bomber-response-text">System ready. Awaiting target coordinates.</span>
            </div>
        </section>

        <!-- SECTION 2: GATEWAY DISPATCHER -->
        <section class="panel panel--secondary" id="gateway-panel">
            <div class="panel__header">
                <div class="panel__icon panel__icon--alt">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
                        <rect x="3" y="4" width="18" height="16" rx="2.5"/>
                        <path d="M7 8h6M7 12h8M7 16h4"/>
                    </svg>
                </div>
                <div class="panel__titles">
                    <h2 class="panel__title">GATEWAY DISPATCHER</h2>
                    <p class="panel__subtitle">Multi-thread packet simulation</p>
                </div>
            </div>

            <div class="matrix-wrap">
                <canvas id="gateway-matrix"></canvas>
            </div>

            <form id="gateway-form" class="app-form" novalidate>
                <div class="form-field">
                    <label for="gateway-target">
                        <span class="form-field__icon">🎯</span>
                        Target Identifier
                    </label>
                    <div class="input-shell">
                        <input type="text" id="gateway-target" placeholder="e.g. +92 300 0000000" required autocomplete="off" spellcheck="false"/>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-field">
                        <label for="gateway-count">
                            <span class="form-field__icon">📦</span>
                            Packet Count
                        </label>
                        <div class="input-shell">
                            <input type="number" id="gateway-count" value="25" min="5" max="100" required/>
                        </div>
                    </div>
                    <div class="form-field">
                        <label for="gateway-delay">
                            <span class="form-field__icon">⏱️</span>
                            Delay (ms)
                        </label>
                        <div class="input-shell">
                            <input type="number" id="gateway-delay" value="500" min="0" required/>
                        </div>
                    </div>
                </div>

                <button type="submit" class="action-btn action-btn--secondary" id="gateway-btn">
                    <span class="action-btn__text">🚀 Initialize Sequence</span>
                </button>
            </form>

            <div class="progress-area hidden" id="gateway-progress">
                <div class="progress-area__head">
                    <span id="gateway-status">Processing packets...</span>
                    <span class="progress-area__percent" id="gateway-percent">0%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-track__fill" id="gateway-bar"></div>
                </div>
                <div class="terminal-log" id="gateway-log">
                    <p>&gt; Initializing secure thread pool...</p>
                </div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer__inner">
            <span class="footer__brand">SALAR KING 👑</span>
            <span class="footer__divider"></span>
            <a href="https://wa.me/+923396967676" target="_blank" rel="noopener noreferrer" class="contact-btn">
                <svg viewBox="0 0 24 24" fill="currentColor" class="contact-btn__icon">
                    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
                </svg>
                Contact Salar King 👑
            </a>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
   </html>
